<!doctype html>
<html lang="en" data-theme="system" data-style="soft">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="description" content="Duet — a fast, beautiful multi-project todo tracker." />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="48x48" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- Apply the saved theme and sidebar state before first paint to avoid a flash. -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem('duet-theme') || 'system';
					document.documentElement.setAttribute('data-theme', t);
					if (localStorage.getItem('duet-sidebar') === 'collapsed') {
						document.documentElement.setAttribute('data-sidebar', 'collapsed');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
